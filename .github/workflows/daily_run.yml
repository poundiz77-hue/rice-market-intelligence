name: Rice Intelligence Daily Automated Run

on:
  schedule:
    - cron: '0 1 * * *'
  workflow_dispatch:

jobs:
  run-rice-script:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install uv environment
        uses: astral-sh/setup-uv@v5

      - name: Sync dependencies & Lockfile
        run: |
          uv sync

      - name: Create credentials.json from Secret
        run: echo "$GCP_SA_KEY" > credentials.json
        env:
          GCP_SA_KEY: ${{ secrets.GCP_SA_KEY }}

      - name: Debug - confirm which Gemini key is loaded
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: |
          echo "Key length (characters):"
          echo -n "$GEMINI_API_KEY" | wc -c
          echo "First 6 characters:"
          echo -n "$GEMINI_API_KEY" | cut -c1-6
          echo ""

      - name: Run Rice Intelligence Engine
        env:
          SPREADSHEET_ID: ${{ secrets.SPREADSHEET_ID }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: uv run python app.py
