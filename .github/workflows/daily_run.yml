name: Rice Intelligence Daily Automated Run

on:
  schedule:
    - cron: '0 1 * * *'
  workflow_dispatch:

jobs:
  run-rice-script:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/python-version@v4
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install google-genai gspread oauth2client pandas

      - name: Create credentials.json from Secret
        env:
          GCP_SA_KEY: ${{ secrets.GCP_SA_KEY }}
        run: |
          echo "$GCP_SA_KEY" > credentials.json

      - name: Run Rice Intelligence Engine
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          SPREADSHEET_ID: ${{ secrets.SPREADSHEET_ID }}
        run: python app.py
